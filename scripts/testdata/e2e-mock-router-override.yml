# Overlay for scripts/e2e-mock-router.sh. Applied ON TOP of
# deploy/secretvm/docker-compose.yml so caps, volumes, networks and the
# bake.env config are exactly the SecretVM ones. Only swaps / test knobs:
#   - uplink -> local image
#   - proxy-router -> stateful python mock (same service name, port 8082).
#     It owns the network namespace; uplink runs in it (network_mode
#     service:proxy-router, base networks reset) and reaches the router and
#     both feeds at http://127.0.0.1:8082: the feed URLs must be https or
#     loopback http. The mock is never restarted mid-run, so every uplink
#     restart rejoins the same namespace. Uplink's depends_on is cleared
#     (compose adds the namespace dependency); the mock depends on nothing.
#     No ports are published.
#   - traefik -> disabled (needs SecretVM certs)
#   - short reconcile gate/retry
#   - bake.env: the SecretVM content with the model catalog served by the
#     mock (two configured models) instead of the public catalog, and
#     without MASTER_KEY_ADMIN (code default false)
services:
  uplink:
    image: ${UPLINK_E2E_IMAGE:-uplink:e2e}
    pull_policy: never
    network_mode: "service:proxy-router"
    networks: !reset []
    depends_on: !reset []
    environment:
      - UPLINK_RECONCILE_GATE_SECONDS=6
      - UPLINK_RECONCILE_RETRY_SECONDS=3
    healthcheck:
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s

  proxy-router:
    image: python:3.12-alpine
    entrypoint: ["python3", "/mock/e2e_mock_router.py", "8082"]
    environment:
      - MOCK_MOR=${E2E_MOCK_MOR:-1000000}
    volumes:
      - ${E2E_MOCK_ROUTER:?set E2E_MOCK_ROUTER to absolute path of e2e_mock_router.py}:/mock/e2e_mock_router.py:ro

  traefik:
    profiles: ["disabled"]

configs:
  uplink_bake_env:
    content: |-
      ACTIVE_MODELS_URL=${E2E_ROUTER_BASE:-http://127.0.0.1:8082}/e2e/catalog
      GATEWAY_BIDS_URL=${E2E_ROUTER_BASE:-http://127.0.0.1:8082}/e2e/bids
      ROUTER_URL=${E2E_ROUTER_BASE:-http://127.0.0.1:8082}
      DATA_DIR=/data
      TRUSTED_PROXY_CIDR=172.28.0.0/16
