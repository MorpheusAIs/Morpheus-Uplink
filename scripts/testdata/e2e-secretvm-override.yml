# Overlay for scripts/e2e-secretvm-handoff.sh. Applied ON TOP of
# deploy/secretvm/docker-compose.yml so caps (init: cap_drop ALL + CHOWN;
# uplink: cap_drop ALL + CHOWN/SETUID/SETGID; manager: cap_drop ALL),
# volumes, networks, bake.env configs and the init ordering are exactly the
# SecretVM ones. Only swaps / test knobs:
#   - uplink, router-user-init, router-allowance-manager -> local image
#   - proxy-router -> stateful python mock (same service name, port 8082)
#   - traefik -> disabled (needs SecretVM certs)
#   - a host-controlled boot id file (simulates a host reboot)
#   - short manager poll and reconcile retry intervals; 2FA not required (curl-driven checks)
#   - bake.env: the SecretVM content with the model catalog served by the
#     mock (two configured models) instead of the public catalog
services:
  router-user-init:
    image: ${UPLINK_E2E_IMAGE:-uplink:e2e}
    pull_policy: never
    environment:
      - UPLINK_BOOT_ID_FILE=/e2e-boot/boot_id
    volumes:
      - ${E2E_BOOT_DIR:?set E2E_BOOT_DIR}:/e2e-boot:ro

  uplink:
    image: ${UPLINK_E2E_IMAGE:-uplink:e2e}
    pull_policy: never
    environment:
      - ADMIN_2FA_REQUIRED=false
      - UPLINK_BOOT_ID_FILE=/e2e-boot/boot_id
      - UPLINK_INIT_WAIT_SECONDS=120
      - UPLINK_ALLOWANCE_POLL_SECONDS=2
      - UPLINK_RECONCILE_GATE_SECONDS=6
      - UPLINK_RECONCILE_RETRY_SECONDS=3
    volumes:
      - ${E2E_BOOT_DIR:?set E2E_BOOT_DIR}:/e2e-boot:ro
    healthcheck:
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s

  router-allowance-manager:
    image: ${UPLINK_E2E_IMAGE:-uplink:e2e}
    pull_policy: never
    environment:
      - ALLOWANCE_POLL_SECONDS=2
      - ALLOWANCE_WRITE_MIN_SECONDS=0
      - ALLOWANCE_FLAG_MIN_SECONDS=2
      - ALLOWANCE_BACKOFF_MAX_SECONDS=4
    healthcheck:
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  proxy-router:
    image: python:3.12-alpine
    entrypoint: ["python3", "/mock/e2e_mock_router.py", "8082"]
    environment:
      - MOCK_MOR=${E2E_MOCK_MOR:-1000000}
    healthcheck:
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s
    volumes:
      - ${E2E_MOCK_ROUTER:?set E2E_MOCK_ROUTER to absolute path of e2e_mock_router.py}:/mock/e2e_mock_router.py:ro

  traefik:
    profiles: ["disabled"]

configs:
  uplink_bake_env:
    content: |-
      SESSION_DURATION_SECONDS=600
      SESSION_FAILOVER=true
      ACTIVE_MODELS_URL=${E2E_ROUTER_BASE:-http://proxy-router:8082}/e2e/catalog
      GATEWAY_BIDS_URL=${E2E_ROUTER_BASE:-http://proxy-router:8082}/e2e/bids
      HOUSEKEEPING=true
      ROUTER_URL=${E2E_ROUTER_BASE:-http://proxy-router:8082}
      ROUTER_AUTH_FILE=/shared/router.auth
      UPLINK_MOR_ALLOWANCE_FILE=/shared/router.mor-allowance.json
      UPLINK_ALLOWANCE_STATUS_FILE=/status/allowance-status.json
      UPLINK_ALLOWANCE_CTL_DIR=/ctl
      DATA_DIR=/data
      TRUSTED_PROXY_CIDR=172.28.0.0/16
