# Overlay for scripts/e2e-secretvm-handoff.sh. Applied ON TOP of
# deploy/secretvm/docker-compose.yml so caps (cap_drop ALL + CHOWN/SETUID/
# SETGID), volumes (router_auth :ro handoff), bake.env configs and the init
# ordering are exactly the SecretVM ones. Only swaps:
#   - uplink + router-user-init -> locally built image (uplink:e2e)
#   - proxy-router -> python mock (same service name, port 8082, cap_drop ALL)
#   - traefik -> disabled (needs SecretVM certs)
services:
  router-user-init:
    image: ${UPLINK_E2E_IMAGE:-uplink:e2e}
    pull_policy: never

  uplink:
    image: ${UPLINK_E2E_IMAGE:-uplink:e2e}
    pull_policy: never
    healthcheck:
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s

  proxy-router:
    image: python:3.12-alpine
    entrypoint: ["python3", "/mock/e2e_mock_router.py", "8082"]
    healthcheck:
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s
    volumes:
      - ${E2E_MOCK_ROUTER:?set E2E_MOCK_ROUTER to absolute path of e2e_mock_router.py}:/mock/e2e_mock_router.py:ro

  traefik:
    profiles: ["disabled"]
