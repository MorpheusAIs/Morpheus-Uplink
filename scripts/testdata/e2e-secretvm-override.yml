# Overlay for scripts/e2e-secretvm-handoff.sh. Applied ON TOP of
# deploy/secretvm/docker-compose.yml so caps (init: cap_drop ALL + CHOWN;
# uplink: cap_drop ALL + CHOWN/SETUID/SETGID; manager: cap_drop ALL),
# volumes, networks, bake.env configs and the init ordering are exactly the
# SecretVM ones. Only swaps / test knobs:
#   - uplink, router-user-init, router-allowance-manager -> local image
#   - proxy-router -> stateful python mock (same service name, port 8082)
#   - traefik -> disabled (needs SecretVM certs)
#   - a host-controlled boot id file (simulates a host reboot)
#   - short manager poll intervals; 2FA not required (curl-driven checks)
services:
  router-user-init:
    image: ${UPLINK_E2E_IMAGE:-uplink:e2e}
    pull_policy: never
    environment:
      - UPLINK_BOOT_ID_FILE=/e2e-boot/boot_id
    volumes:
      - ${E2E_BOOT_DIR:?set E2E_BOOT_DIR}:/e2e-boot:ro

  uplink:
    image: ${UPLINK_E2E_IMAGE:-uplink:e2e}
    pull_policy: never
    environment:
      - ADMIN_2FA_REQUIRED=false
      - UPLINK_BOOT_ID_FILE=/e2e-boot/boot_id
      - UPLINK_INIT_WAIT_SECONDS=120
      - UPLINK_ALLOWANCE_POLL_SECONDS=2
    volumes:
      - ${E2E_BOOT_DIR:?set E2E_BOOT_DIR}:/e2e-boot:ro
    healthcheck:
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s

  router-allowance-manager:
    image: ${UPLINK_E2E_IMAGE:-uplink:e2e}
    pull_policy: never
    environment:
      - ALLOWANCE_POLL_SECONDS=2
      - ALLOWANCE_WRITE_MIN_SECONDS=0
      - ALLOWANCE_FLAG_MIN_SECONDS=2
      - ALLOWANCE_BACKOFF_MAX_SECONDS=4
    healthcheck:
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  proxy-router:
    image: python:3.12-alpine
    entrypoint: ["python3", "/mock/e2e_mock_router.py", "8082"]
    environment:
      - MOCK_MOR=${E2E_MOCK_MOR:-1000000}
    healthcheck:
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s
    volumes:
      - ${E2E_MOCK_ROUTER:?set E2E_MOCK_ROUTER to absolute path of e2e_mock_router.py}:/mock/e2e_mock_router.py:ro

  traefik:
    profiles: ["disabled"]
