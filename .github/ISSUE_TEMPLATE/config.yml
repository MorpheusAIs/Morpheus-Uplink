blank_issues_enabled: false
contact_links:
  - name: Ask a question or share an idea
    url: https://github.com/orgs/MorpheusAIs/discussions
    about: Use a matching Discussions category. Ideas go in Ideas.
  - name: Operator guide
    url: https://github.com/MorpheusAIs/Morpheus-Uplink/blob/main/docs/README.md
    about: Install, fund, connect clients, and update. Questions are not tracked as issues
  - name: Report a security issue
    url: https://github.com/MorpheusAIs/Morpheus-Uplink/security/policy
    about: Report a vulnerability privately. Do not open a public issue
  - name: Hosted API
    url: https://github.com/MorpheusAIs/Morpheus-Marketplace-API/issues/new/choose
    about: Bugs and requests for api.mor.org belong on Morpheus-Marketplace-API
  - name: Node software
    url: https://github.com/MorpheusAIs/Morpheus-Lumerin-Node/issues/new/choose
    about: Bugs and requests for the proxy-router, MorpheusUI, and the CLI belong on Morpheus-Lumerin-Node
