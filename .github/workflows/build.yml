# Uplink CI/CD
#
# Flow (mirrors the Morpheus-Lumerin-Node semantic-versioning scheme,
# adapted to a single-component repo):
#
#   - Pull requests to main        → tests + govulncheck + image smoke (no push)
#   - Merge/push to main           → tests → semver tag → multi-arch image
#                                    push to GHCR → GitHub release with a
#                                    digest-pinned SecretVM compose attached
#   - workflow_dispatch on branch  → prerelease build vX.Y.N-<branch>
#                                    (image pushed, no release, no `latest`)
#
# Version rules on main:
#   - floor: VMAJ_NEW/VMIN_NEW below (first release = v0.1.0)
#   - merge commit message contains #major → major bump
#   - merge commit message contains #minor → minor bump
#   - otherwise                            → patch bump
#
# Publishing uses the workflow's GITHUB_TOKEN (packages: write) — no PAT.
# NOTE (one-time): after the first push, make the ghcr.io/absgrafx/uplink
# package public in its settings so SecretVM can pull anonymously.
name: CI/CD

# Only material paths run the pipeline (vet/test, and on main: tag + image +
# release). Doc / marketing / agent-corpus edits must not cut a new version.
#
# Triggers a build:
#   cmd/ internal/     Go binary + embedded GUI
#   go.mod go.sum      module graph
#   Dockerfile         image layers
#   deploy/            entrypoint in image + SecretVM/generic release assets
#   docker-compose.local.yml   CI ASCII / local-stack contract
#   this workflow      CI itself
#
# Does NOT trigger (examples): docs/**, README.md, AGENTS.md, DISCLAIMER.md,
# LICENSE, NOTICE, llms*.txt, scripts/**, .ai-docs/**, .env.example
#
# workflow_dispatch always runs (manual prerelease / force publish).
on:
  pull_request:
    branches: [main]
    paths:
      - "cmd/**"
      - "internal/**"
      - "deploy/**"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - "docker-compose.local.yml"
      - ".github/workflows/build.yml"
  push:
    branches: [main]
    paths:
      - "cmd/**"
      - "internal/**"
      - "deploy/**"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - "docker-compose.local.yml"
      - ".github/workflows/build.yml"
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/absgrafx/uplink

jobs:
  test:
    name: Vet & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go mod tidy check
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod; then
            echo "❌ go.mod is out of date — run 'go mod tidy' and commit."
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          set +e
          out=$(govulncheck ./... 2>&1)
          code=$?
          printf '%s\n' "$out"
          {
            echo "### govulncheck"
            echo '```'
            printf '%s\n' "$out" | tail -n 80
            echo '```'
            if [ "$code" -ne 0 ]; then
              echo ""
              echo "Findings present (commonly transitive via go-ethereum / stdlib)."
              echo "Advisory for this workflow: does not fail the job until a dep-bump policy lands."
            else
              echo ""
              echo "No findings."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          # Keep the gate visible in logs; do not block stock-7.11 hardening PRs on
          # pre-existing geth call-graph findings.
          exit 0
      - name: Deploy files must be ASCII (SecretVM btoa chokes on Latin1+)
        run: |
          if LC_ALL=C grep -rnP '[^\x00-\x7F]' deploy/ docker-compose.local.yml .env.example; then
            echo "❌ Non-ASCII characters found in deploy-facing files."
            exit 1
          fi
          echo "✅ Deploy files are pure ASCII"
      - name: SecretVM compose prompts only for real secrets
        run: |
          # SecretVM scrapes environment: / substitutions into Encrypted
          # Secrets. Allowlisted keys may use substitutions (so the form
          # prompts). Non-secrets must stay in configs: only.
          ALLOWED='ADMIN_PASSWORD|API_KEY_SEED|COOKIE_CONTENT|WALLET_PRIVATE_KEY|ETH_NODE_ADDRESS|WEB_PUBLIC_URL|SESSION_DURATION_SECONDS'
          FORBIDDEN='ETH_NODE_CHAIN_ID|ETH_NODE_USE_SUBSCRIPTIONS|BLOCKSCOUT_API_URL|DIAMOND_CONTRACT_ADDRESS|MOR_TOKEN_ADDRESS'
          # Any forbidden key appearing as an environment assignment/sub.
          if grep -nE "^\s+- (${FORBIDDEN})=" deploy/secretvm/docker-compose.yml; then
            echo "❌ Non-secret network config must not be in environment: (use configs:)"
            exit 1
          fi
          # Every substitution must be allowlisted (ignore comment lines).
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            var=$(echo "$line" | sed -nE 's/.*\$\{([A-Za-z_][A-Za-z0-9_]*).*/\1/p')
            [ -z "$var" ] && continue
            if ! echo "$var" | grep -qE "^(${ALLOWED})$"; then
              echo "❌ Unallowlisted substitution: $line"
              exit 1
            fi
          done < <(grep -nF '${' deploy/secretvm/docker-compose.yml | grep -vE '^[0-9]+:[[:space:]]*#')
          # Required secrets must be prompted.
          for req in ADMIN_PASSWORD API_KEY_SEED COOKIE_CONTENT WALLET_PRIVATE_KEY ETH_NODE_ADDRESS; do
            needle='${'"${req}"'}'
            if ! grep -qF "$needle" deploy/secretvm/docker-compose.yml; then
              echo "❌ Missing required secret prompt: $req"
              exit 1
            fi
          done
          echo "✅ SecretVM compose prompts for secrets only; network config stays in configs:"

  pr-image-smoke:
    name: PR image smoke
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Build image (no registry push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: uplink:pr-smoke
          build-args: |
            VERSION=pr-smoke
      - name: Assert non-root runtime drop
        run: |
          # Entrypoint chowns the volume as root then su-exec to uid 10001 (uplink).
          docker run --rm --entrypoint /bin/sh uplink:pr-smoke -c '
            set -e
            id -u uplink | grep -qx 10001
            grep -q "su-exec uplink" /docker-entrypoint.sh
            test ! -u /usr/local/bin/uplink
          '
          echo "+ Non-root drop (uplink uid 10001) asserted - no GHCR push on PR"

  generate-tag:
    name: Generate Tag
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name != 'pull_request'
    outputs:
      tag_name: ${{ steps.gen.outputs.tag_name }}
      vfull: ${{ steps.gen.outputs.vfull }}
      is_release: ${{ steps.gen.outputs.is_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Determine version
        id: gen
        shell: bash
        run: |
          # Version floor — bump these to force a new major/minor baseline.
          VMAJ_NEW=0
          VMIN_NEW=1
          set +o pipefail

          # Last clean production tag (no -branch suffixes), semver-sorted.
          VLAST=$(git tag -l "v[0-9]*" | grep -E "^v[0-9]+\.[0-9]+\.[0-9]+$" | sort -V | tail -n 1 | cut -c2-)
          if [ -n "$VLAST" ]; then
            eval "$(echo "$VLAST" | awk -F '.' '{print "VMAJ="$1" VMIN="$2" VPAT="$3}')"
          else
            VMAJ=0; VMIN=0; VPAT=0
          fi

          FLOOR="${VMAJ_NEW}.${VMIN_NEW}.0"
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            MSG=$(git log -1 --pretty=%B)
            HIGHEST=$(printf '%s\n%s\n' "$FLOOR" "${VLAST:-0.0.0}" | sort -V | tail -n 1)
            if [ "$HIGHEST" = "$FLOOR" ] && [ "$FLOOR" != "$VLAST" ]; then
              VMAJ=$VMAJ_NEW; VMIN=$VMIN_NEW; VPAT=0
              BUMP="floor (first release at v${FLOOR})"
            elif echo "$MSG" | grep -q '#major'; then
              VMAJ=$((VMAJ+1)); VMIN=0; VPAT=0
              BUMP="major (#major in commit message)"
            elif echo "$MSG" | grep -q '#minor'; then
              VMIN=$((VMIN+1)); VPAT=0
              BUMP="minor (#minor in commit message)"
            else
              VPAT=$((VPAT+1))
              BUMP="patch"
            fi
            VFULL=${VMAJ}.${VMIN}.${VPAT}
            VTAG=v${VFULL}
            IS_RELEASE=true
          else
            # Prerelease off main: patch = commits since merge-base with main.
            MB=$(git merge-base refs/remotes/origin/main HEAD)
            VPAT=$(git rev-list --count --no-merges "${MB}..HEAD")
            VFULL=${VMAJ}.${VMIN}.${VPAT}
            RNAME=${GITHUB_REF_NAME##*/}
            VTAG=v${VFULL}-${RNAME}
            BUMP="prerelease (${RNAME})"
            IS_RELEASE=false
          fi

          {
            echo "tag_name=${VTAG}"
            echo "vfull=${VFULL}"
            echo "is_release=${IS_RELEASE}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "✅ New tag: ${VTAG} (${BUMP})"
            echo "✅ Image: ${IMAGE_NAME}:${VTAG}"
            echo "ℹ️ Previous production tag: v${VLAST:-none}"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Build & Publish Image
    runs-on: ubuntu-latest
    needs: [generate-tag]
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
      packages: write
    env:
      VTAG: ${{ needs.generate-tag.outputs.tag_name }}
      IS_RELEASE: ${{ needs.generate-tag.outputs.is_release }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compose image tags
        id: tags
        run: |
          TAGS="${IMAGE_NAME}:${VTAG}"
          if [ "$IS_RELEASE" = "true" ]; then
            TAGS="${TAGS},${IMAGE_NAME}:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ env.VTAG }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VTAG }}

      - name: Generate digest-pinned deploy assets
        id: pin
        run: |
          DIGEST=$(docker buildx imagetools inspect "${IMAGE_NAME}:${VTAG}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          pin_uplink() {
            sed -E "s|image: ${IMAGE_NAME}[^[:space:]]*|image: ${IMAGE_NAME}@${DIGEST}|" "$1" > "$2"
          }
          pin_uplink deploy/secretvm/docker-compose.yml docker-compose.secretvm.deployed.yml
          pin_uplink deploy/generic/docker-compose.yml docker-compose.generic.deployed.yml
          cp deploy/secretvm/env.template env.secretvm.example
          cp deploy/generic/env.example env.generic.example
          {
            echo "✅ Image digest: ${DIGEST}"
            echo '```yaml'
            grep 'image: ' docker-compose.secretvm.deployed.yml docker-compose.generic.deployed.yml
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deployed compose artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uplink-deploy-${{ env.VTAG }}
          path: |
            docker-compose.secretvm.deployed.yml
            docker-compose.generic.deployed.yml
            env.secretvm.example
            env.generic.example

      - name: Create GitHub release
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "Image: \`${IMAGE_NAME}:${VTAG}\` (digest \`${{ steps.pin.outputs.digest }}\`)"
            echo ""
            echo "**Do not clone the repo to run Uplink.** Download the release assets and pull from \`ghcr.io\`:"
            echo ""
            echo "- SecretVM: \`docker-compose.secretvm.deployed.yml\` + \`env.secretvm.example\`"
            echo "- Any Docker VPS: \`docker-compose.generic.deployed.yml\` + \`env.generic.example\`"
            echo ""
            echo "Operator guide: https://github.com/absgrafx/Morpheus-Uplink/blob/main/docs/README.md"
          } > release-notes.md
          gh release create "${VTAG}" \
            docker-compose.secretvm.deployed.yml \
            docker-compose.generic.deployed.yml \
            env.secretvm.example \
            env.generic.example \
            --title "${VTAG}" \
            --notes-file release-notes.md
