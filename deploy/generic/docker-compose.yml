# Uplink on any Docker host (VPS, Phala/dstack, home lab).
#
# Same stack as SecretVM, but secrets come from a normal .env file and
# Caddy terminates TLS with Let's Encrypt (no SecretVM cert mount).
#
# Prefer the digest-pinned release asset (no git clone):
#   curl -fsSL -O https://github.com/MorpheusAIs/Morpheus-Uplink/releases/latest/download/docker-compose.generic.deployed.yml
#   curl -fsSL -o .env https://github.com/MorpheusAIs/Morpheus-Uplink/releases/latest/download/env.generic.example
#   # edit .env (PUBLIC_HOST + secrets), then:
#   docker compose -f docker-compose.generic.deployed.yml --env-file .env up -d
#
# Gateway: https://${PUBLIC_HOST}/gui
# Only :80 and :443 need to be public. Router :8082 stays internal.
#
# Privacy env (L1): PROXY_* and LOG_LEVEL_* are set and believed honored on
# pinned v7.18.0; live acceptance pending. Do not market as TEE privacy.
#
# Lumerin pin note: tag v7.18.0 is Lumerin main (gateway caps).
# NOT Base testnet -- chain comes from env (defaults Base mainnet 8453 /
# Diamond / MOR below).
#
# H2 blast radius / H3 single-replica: see deploy/generic/README.md.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  caddy:
    image: caddy:2.9.1-alpine@sha256:b4e3952384eb9524a887633ce65c752dd7c71314d2c2acf98cd5c715aaa534f0
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST to your DNS name}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    networks:
      - web
    depends_on:
      - uplink

  uplink:
    # Pinned to the current release (v1.0.24); release assets re-pin it to
    # the built digest (scripts/deploy-assets.sh). Bumped after each release.
    image: ghcr.io/morpheusais/uplink@sha256:0df5e82d88d554cec4710c52960fb71b090f2958fe7d2b9dcb52fda6a1326249
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    # No init: true here: the entrypoint execs the app as PID 1 so docker stop
    # delivers SIGTERM to it and open sessions close before exit.
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - MASTER_KEY_ADMIN=${MASTER_KEY_ADMIN:-false}
      # Break-glass: true for one restart wipes 2FA (docs/06-developers.md).
      - UPLINK_RESET_2FA=${UPLINK_RESET_2FA:-false}
      - TRUSTED_PROXY_CIDR=172.28.0.0/16
      - API_KEY_SEED=${API_KEY_SEED}
      # Same user:pass as the router (ROUTER_AUTH works too).
      - COOKIE_CONTENT=${COOKIE_CONTENT:?set COOKIE_CONTENT to user:password}
      - ROUTER_URL=http://proxy-router:8082
      - WEB_PUBLIC_URL=${WEB_PUBLIC_URL}
      # Presence only: whether the router's RPC is set (the value is never logged).
      - ETH_NODE_ADDRESS=${ETH_NODE_ADDRESS}
      - ACTIVE_MODELS_URL=${ACTIVE_MODELS_URL:-https://active.mor.org/gateway_models.json}
      - GATEWAY_BIDS_URL=${GATEWAY_BIDS_URL:-https://active.mor.org/gateway_bids.json}
      - DATA_DIR=/data
    volumes:
      - uplink_data:/data
    networks:
      - web
    # Start order only. The router image is FROM scratch (no shell or wget),
    # so it has no container healthcheck; Uplink retries the router itself.
    depends_on:
      - proxy-router

  proxy-router:
    image: ghcr.io/morpheusais/morpheus-lumerin-node:v7.18.0@sha256:070b99a8104c6e19d1c25c932a313e72a50fb5caa82d87554b22899370e444ba
    restart: unless-stopped
    logging: *default-logging
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 45s
    environment:
      - WALLET_PRIVATE_KEY=${WALLET_PRIVATE_KEY}
      - ETH_NODE_ADDRESS=${ETH_NODE_ADDRESS}
      - ETH_NODE_CHAIN_ID=${ETH_NODE_CHAIN_ID:-8453}
      - ETH_NODE_USE_SUBSCRIPTIONS=${ETH_NODE_USE_SUBSCRIPTIONS:-false}
      - BLOCKSCOUT_API_URL=${BLOCKSCOUT_API_URL:-https://base.blockscout.com/api/v2}
      - DIAMOND_CONTRACT_ADDRESS=${DIAMOND_CONTRACT_ADDRESS:-0x6aBE1d282f72B474E54527D93b979A4f64d3030a}
      - MOR_TOKEN_ADDRESS=${MOR_TOKEN_ADDRESS:-0x7431ada8a591c955a994a21710752ef9b882b8e3}
      - COOKIE_CONTENT=${COOKIE_CONTENT:?set COOKIE_CONTENT to admin:password}
      - WEB_PUBLIC_URL=${WEB_PUBLIC_URL}
      - AUTH_CONFIG_FILE_PATH=/app/data/proxy.conf
      - COOKIE_FILE_PATH=/app/data/.cookie
      - ENVIRONMENT=production
      - PROXY_STORE_CHAT_CONTEXT=${PROXY_STORE_CHAT_CONTEXT:-false}
      - PROXY_FORWARD_CHAT_CONTEXT=${PROXY_FORWARD_CHAT_CONTEXT:-false}
      - LOG_LEVEL_APP=${LOG_LEVEL_APP:-warn}
      - LOG_LEVEL_TCP=${LOG_LEVEL_TCP:-warn}
      - LOG_LEVEL_ETH_RPC=${LOG_LEVEL_ETH_RPC:-warn}
    volumes:
      - router_data:/app/data
    networks:
      - web
    # Intentionally no ports: only uplink can reach :8082.

volumes:
  uplink_data:
  router_data:
  caddy_data:
  caddy_config:

networks:
  web:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

configs:
  caddyfile:
    content: |
      {$PUBLIC_HOST} {
        log {
          output stdout
          format json
        }
        @allowed {
          path / /gui /gui/* /v1/* /admin/* /healthcheck
        }
        handle @allowed {
          reverse_proxy uplink:8080 {
            flush_interval -1
          }
        }
        handle {
          respond 404
        }
      }
