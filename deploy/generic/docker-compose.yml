# Uplink on any Docker host (VPS, Phala/dstack, home lab).
#
# Same stack as SecretVM, but secrets come from a normal .env file and
# Caddy terminates TLS with Let's Encrypt (no SecretVM cert mount).
#
# Prefer the digest-pinned release asset (no git clone):
#   curl -fsSL -O https://github.com/MorpheusAIs/Morpheus-Uplink/releases/latest/download/docker-compose.generic.deployed.yml
#   curl -fsSL -o .env https://github.com/MorpheusAIs/Morpheus-Uplink/releases/latest/download/env.generic.example
#   # edit .env (PUBLIC_HOST + secrets), then:
#   docker compose -f docker-compose.generic.deployed.yml --env-file .env up -d
#
# Gateway: https://${PUBLIC_HOST}/gui
# Only :80 and :443 need to be public. Router :8082 stays internal.
#
# Privacy env (L1): PROXY_* and LOG_LEVEL_* are set and believed honored on
# pinned v7.15.0; live acceptance pending. Do not market as TEE privacy.
#
# Lumerin pin note: tag v7.15.0 is Lumerin main (scoped auth + gateway caps).
# NOT Base testnet -- chain comes from env (defaults Base mainnet 8453 /
# Diamond / MOR below).
#
# H2 blast radius / H3 single-replica: see deploy/generic/README.md.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  caddy:
    image: caddy:2.9.1-alpine@sha256:b4e3952384eb9524a887633ce65c752dd7c71314d2c2acf98cd5c715aaa534f0
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST to your DNS name}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    networks:
      - web
    depends_on:
      - uplink

  router-user-init:
    image: curlimages/curl:8.12.1@sha256:94e9e444bcba979c2ea12e27ae39bee4cd10bc7041a472c4727a558e213744e6
    restart: "no"
    logging: *default-logging
    environment:
      - ROUTER_URL=http://proxy-router:8082
      - COOKIE_CONTENT=${COOKIE_CONTENT:?set COOKIE_CONTENT to admin:password}
      - UPLINK_MOR_ALLOWANCE_WEI=${UPLINK_MOR_ALLOWANCE_WEI:?set UPLINK_MOR_ALLOWANCE_WEI (wei)}
      - MOR_TOKEN_ADDRESS=${MOR_TOKEN_ADDRESS:-0x7431ada8a591c955a994a21710752ef9b882b8e3}
      - ROUTER_AUTH_OUT=/shared/router.auth
    configs:
      - source: router_user_init
        target: /init.sh
        mode: 0555
    volumes:
      - router_auth:/shared
    networks:
      - web
    depends_on:
      - proxy-router
    entrypoint: ["/bin/sh", "/init.sh"]

  uplink:
    # TODO digest: pin after Alan build go (CI release check fails if still :latest or TODO)
    image: ghcr.io/morpheusais/uplink:latest # TODO digest=@sha256:REPLACE_AFTER_ALAN_BUILD
    restart: unless-stopped
    logging: *default-logging
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_2FA_REQUIRED=true
      - MASTER_KEY_ADMIN=false
      - API_KEY_SEED=${API_KEY_SEED}
      - ROUTER_URL=http://proxy-router:8082
      - ROUTER_AUTH_FILE=/shared/router.auth
      - UPLINK_MOR_ALLOWANCE_WEI=${UPLINK_MOR_ALLOWANCE_WEI:?set UPLINK_MOR_ALLOWANCE_WEI (wei)}
      - WEB_PUBLIC_URL=${WEB_PUBLIC_URL}
      - SESSION_DURATION_SECONDS=600
      - SESSION_FAILOVER=true
      - ACTIVE_MODELS_URL=https://active.mor.org/gateway_models.json
      - GATEWAY_BIDS_URL=https://active.mor.org/gateway_bids.json
      - HOUSEKEEPING=true
      - DATA_DIR=/data
    volumes:
      - uplink_data:/data
      - router_auth:/shared:ro
    networks:
      - web
    depends_on:
      router-user-init:
        condition: service_completed_successfully
      proxy-router:
        condition: service_started

  proxy-router:
    image: ghcr.io/morpheusais/morpheus-lumerin-node:v7.15.0@sha256:c52e9f12725d7c85e09eec11e0c06ae2b0970d12d1c770dc4daa4cc66f961ea4
    restart: unless-stopped
    logging: *default-logging
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/healthcheck || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    environment:
      - WALLET_PRIVATE_KEY=${WALLET_PRIVATE_KEY}
      - ETH_NODE_ADDRESS=${ETH_NODE_ADDRESS}
      - ETH_NODE_CHAIN_ID=${ETH_NODE_CHAIN_ID:-8453}
      - ETH_NODE_USE_SUBSCRIPTIONS=false
      - BLOCKSCOUT_API_URL=${BLOCKSCOUT_API_URL:-https://base.blockscout.com/api/v2}
      - DIAMOND_CONTRACT_ADDRESS=${DIAMOND_CONTRACT_ADDRESS:-0x6aBE1d282f72B474E54527D93b979A4f64d3030a}
      - MOR_TOKEN_ADDRESS=${MOR_TOKEN_ADDRESS:-0x7431ada8a591c955a994a21710752ef9b882b8e3}
      - COOKIE_CONTENT=${COOKIE_CONTENT:?set COOKIE_CONTENT to admin:password}
      - WEB_PUBLIC_URL=${WEB_PUBLIC_URL}
      - AUTH_CONFIG_FILE_PATH=/app/data/proxy.conf
      - COOKIE_FILE_PATH=/app/data/.cookie
      - ENVIRONMENT=production
      - PROXY_STORE_CHAT_CONTEXT=false
      - PROXY_FORWARD_CHAT_CONTEXT=false
      - LOG_LEVEL_APP=warn
      - LOG_LEVEL_TCP=warn
      - LOG_LEVEL_ETH_RPC=warn
    volumes:
      - router_data:/app/data
    networks:
      - web

volumes:
  uplink_data:
  router_data:
  router_auth:
  caddy_data:
  caddy_config:

networks:
  web:
    driver: bridge

configs:
  caddyfile:
    content: |
      {$PUBLIC_HOST} {
        log {
          output stdout
          format json
        }
        @allowed {
          path / /gui /gui/* /v1/* /admin/* /healthcheck
        }
        handle @allowed {
          reverse_proxy uplink:8080 {
            flush_interval -1
          }
        }
        handle {
          respond 404
        }
      }
  router_user_init:
    content: |-
      #!/bin/sh
      # Create scoped router user "uplink" with MOR allowance. Idempotent.
      # Writes uplink:<password> to ROUTER_AUTH_OUT (mode 0400). Never logs the password.
      set -eu

      ROUTER_URL="${ROUTER_URL:-http://proxy-router:8082}"
      AUTH_OUT="${ROUTER_AUTH_OUT:-/shared/router.auth}"
      USER_NAME="${UPLINK_ROUTER_USER:-uplink}"
      ALLOWANCE_WEI="${UPLINK_MOR_ALLOWANCE_WEI:?UPLINK_MOR_ALLOWANCE_WEI required}"
      MOR_TOKEN="${MOR_TOKEN_ADDRESS:-0x7431ada8a591c955a994a21710752ef9b882b8e3}"
      # Lowercase token address (router allowance lookup is case-sensitive to lower).
      MOR_TOKEN=$(printf '%s' "$MOR_TOKEN" | tr 'A-F' 'a-f')

      if [ -z "$ALLOWANCE_WEI" ] || [ "$ALLOWANCE_WEI" = "0" ]; then
        echo "router-user-init: UPLINK_MOR_ALLOWANCE_WEI missing or zero" >&2
        exit 1
      fi

      COOKIE_CONTENT="${COOKIE_CONTENT:?COOKIE_CONTENT required for admin confirm}"
      ADMIN_USER=$(printf '%s' "$COOKIE_CONTENT" | cut -d: -f1)
      ADMIN_PASS=$(printf '%s' "$COOKIE_CONTENT" | cut -d: -f2-)

      echo "router-user-init: waiting for router healthcheck..."
      i=0
      while [ "$i" -lt 90 ]; do
        if curl -fsS "$ROUTER_URL/healthcheck" >/dev/null 2>&1; then
          break
        fi
        i=$((i + 1))
        sleep 2
      done
      if [ "$i" -ge 90 ]; then
        echo "router-user-init: router healthcheck timeout" >&2
        exit 1
      fi

      PASS=$(dd if=/dev/urandom bs=32 count=1 2>/dev/null | od -An -tx1 | tr -d ' \n')
      if [ "${#PASS}" -lt 32 ]; then
        echo "router-user-init: failed to generate password" >&2
        exit 1
      fi

      PERMS='["chat","embeddings","open_session","close_session","get_sessions","get_wallet","get_balance","get_supply","get_budget","get_stakes_on_hold","withdraw_user_stakes"]'

      echo "router-user-init: delete existing user (ignore errors)..."
      curl -fsS -u "${ADMIN_USER}:${ADMIN_PASS}" -X DELETE \
        -H 'Content-Type: application/json' \
        -d "{\"username\":\"${USER_NAME}\"}" \
        "$ROUTER_URL/auth/users" >/dev/null 2>&1 || true

      echo "router-user-init: request agent user..."
      # Build JSON without echoing password to logs - use env for curl data via printf to file
      REQ_FILE=$(mktemp)
      CONF_FILE=$(mktemp)
      trap 'rm -f "$REQ_FILE" "$CONF_FILE"' EXIT
      printf '{"username":"%s","password":"%s","perms":%s,"allowances":{"%s":"%s"}}' \
        "$USER_NAME" "$PASS" "$PERMS" "$MOR_TOKEN" "$ALLOWANCE_WEI" > "$REQ_FILE"

      curl -fsS -X POST -H 'Content-Type: application/json' \
        --data-binary @"$REQ_FILE" \
        "$ROUTER_URL/auth/users/request" >/dev/null

      echo "router-user-init: confirm agent user..."
      printf '{"username":"%s","confirm":true}' "$USER_NAME" > "$CONF_FILE"
      curl -fsS -u "${ADMIN_USER}:${ADMIN_PASS}" -X POST \
        -H 'Content-Type: application/json' \
        --data-binary @"$CONF_FILE" \
        "$ROUTER_URL/auth/users/confirm" >/dev/null

      umask 077
      printf '%s:%s\n' "$USER_NAME" "$PASS" > "$AUTH_OUT"
      chmod 0400 "$AUTH_OUT"
      echo "router-user-init: wrote ROUTER_AUTH file (mode 0400); done"
