# Uplink on any Docker host (VPS, Phala/dstack, home lab).
#
# Same stack as SecretVM, but secrets come from a normal .env file and
# Caddy terminates TLS with Let's Encrypt (no SecretVM cert mount).
#
# Prefer the digest-pinned release asset (no git clone):
#   curl -fsSL -O https://github.com/MorpheusAIs/Morpheus-Uplink/releases/latest/download/docker-compose.generic.deployed.yml
#   curl -fsSL -o .env https://github.com/MorpheusAIs/Morpheus-Uplink/releases/latest/download/env.generic.example
#   # edit .env (PUBLIC_HOST + secrets), then:
#   docker compose -f docker-compose.generic.deployed.yml --env-file .env up -d
#
# Gateway: https://${PUBLIC_HOST}/gui
# Only :80 and :443 need to be public. Router :8082 stays internal.
#
# Privacy env (L1): PROXY_* and LOG_LEVEL_* are set and believed honored on
# pinned v7.15.0; live acceptance pending. Do not market as TEE privacy.
#
# Lumerin pin note: tag v7.15.0 is Lumerin main (scoped auth + gateway caps).
# NOT Base testnet -- chain comes from env (defaults Base mainnet 8453 /
# Diamond / MOR below).
#
# H2 blast radius / H3 single-replica: see deploy/generic/README.md.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  caddy:
    image: caddy:2.9.1-alpine@sha256:b4e3952384eb9524a887633ce65c752dd7c71314d2c2acf98cd5c715aaa534f0
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST to your DNS name}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    networks:
      - web
    depends_on:
      - uplink

  router-user-init:
    # Same Uplink image (digest-pinned at release). Script is baked at
    # /usr/local/bin/router-user-init.sh - single-file paste deploys work.
    image: ghcr.io/morpheusais/uplink:latest # TODO digest=@sha256:REPLACE_AT_RELEASE
    # Root so named-volume /shared is writable. Files stay root-owned (0400
    # auth, 0444 allowance + wallet, 0400 ready marker); the uplink
    # entrypoint (root, no DAC_OVERRIDE) reads them as owner and copies them
    # into DATA_DIR as the uplink user. Each run first removes the previous
    # files, then writes the ready marker last; Uplink only accepts files
    # matching a marker for the current boot. The scoped credential stays on
    # disk in /shared and in Uplink's /data; init keeps it while the router
    # accepts it and re-mints when it is rejected or /shared/router.auth is
    # missing (see the README for forcing a new one).
    user: "0:0"
    restart: "no"
    logging: *default-logging
    # Only CAP_CHOWN: it creates, renames and removes root-owned files in
    # /shared and /mgr, and hands the /mgr, /status and /ctl mount
    # directories (never their contents) to their owners. No DAC_OVERRIDE,
    # no FOWNER. The manager's admin credential (/mgr/admin.cookie, 0400,
    # uid 10002) is rewritten on every run and stays on disk until the
    # manager_cred volume is removed.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    environment:
      - ROUTER_URL=http://proxy-router:8082
      - COOKIE_CONTENT=${COOKIE_CONTENT:?set COOKIE_CONTENT to admin:password}
      # Optional manual cap; empty/unset => auto from wallet MOR balance at boot.
      - UPLINK_MOR_ALLOWANCE_WEI=${UPLINK_MOR_ALLOWANCE_WEI:-}
      - MOR_TOKEN_ADDRESS=${MOR_TOKEN_ADDRESS:-0x7431ada8a591c955a994a21710752ef9b882b8e3}
      - ROUTER_AUTH_OUT=/shared/router.auth
      - UPLINK_MOR_ALLOWANCE_FILE=/shared/router.mor-allowance.json
    volumes:
      - router_auth:/shared
      - manager_cred:/mgr
      - allowance_status:/status
      - allowance_ctl:/ctl
    networks:
      - web
    depends_on:
      - proxy-router
    entrypoint: ["/bin/sh", "/usr/local/bin/router-user-init.sh"]

  uplink:
    # TODO digest: pin at release (CI release check fails if still :latest or TODO)
    image: ghcr.io/morpheusais/uplink:latest # TODO digest=@sha256:REPLACE_AT_RELEASE
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    # No init: true here: the entrypoint execs the app as PID 1 so docker stop
    # delivers SIGTERM to it and open sessions close before exit.
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_2FA_REQUIRED=true
      - MASTER_KEY_ADMIN=false
      - TRUSTED_PROXY_CIDR=172.28.0.0/16
      - API_KEY_SEED=${API_KEY_SEED}
      - ROUTER_URL=http://proxy-router:8082
      - ROUTER_AUTH_FILE=/shared/router.auth
      - UPLINK_MOR_ALLOWANCE_WEI=${UPLINK_MOR_ALLOWANCE_WEI:-}
      - UPLINK_MOR_ALLOWANCE_FILE=/shared/router.mor-allowance.json
      - UPLINK_ALLOWANCE_STATUS_FILE=/status/allowance-status.json
      - UPLINK_ALLOWANCE_CTL_DIR=/ctl
      - WEB_PUBLIC_URL=${WEB_PUBLIC_URL}
      - SESSION_DURATION_SECONDS=600
      - SESSION_FAILOVER=true
      - ACTIVE_MODELS_URL=https://active.mor.org/gateway_models.json
      - GATEWAY_BIDS_URL=https://active.mor.org/gateway_bids.json
      - HOUSEKEEPING=true
      - DATA_DIR=/data
    volumes:
      - uplink_data:/data
      - router_auth:/shared:ro
      # Allowance manager status (read-only) and the resync request flag dir.
      # Separate volumes, never under DATA_DIR.
      - allowance_status:/status:ro
      - allowance_ctl:/ctl
    networks:
      - web
    # Compose order. The Docker daemon ignores depends_on when it restarts
    # containers after a host reboot, so the entrypoint also waits for
    # router-user-init's ready marker for this boot (see docker-entrypoint.sh).
    depends_on:
      router-user-init:
        condition: service_completed_successfully
        # Re-running init (compose up / restart) also restarts Uplink so it
        # picks up the new snapshot; init keeps a still-valid credential.
        restart: true
      proxy-router:
        condition: service_healthy

  router-allowance-manager:
    # Keeps the scoped user's allowance equal to the wallet MOR balance in
    # balance mode (empty UPLINK_MOR_ALLOWANCE_WEI). Same image as uplink.
    # Admin credential comes from /mgr/admin.cookie (0400, uid 10002), not
    # env. Only on the internal router_admin network: it can reach
    # proxy-router and nothing else (no Uplink, no internet).
    image: ghcr.io/morpheusais/uplink:latest # TODO digest=@sha256:REPLACE_AT_RELEASE
    user: "10002:10002"
    group_add:
      - "10003"
    restart: unless-stopped
    logging: *default-logging
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ulimits:
      core: 0
    environment:
      # Same expression as router-user-init: any non-empty value means a
      # fixed cap and the manager never writes.
      - UPLINK_MOR_ALLOWANCE_WEI=${UPLINK_MOR_ALLOWANCE_WEI:-}
      - MOR_TOKEN_ADDRESS=${MOR_TOKEN_ADDRESS:-0x7431ada8a591c955a994a21710752ef9b882b8e3}
    volumes:
      - manager_cred:/mgr:ro
      - allowance_status:/status
      - allowance_ctl:/ctl
    networks:
      - router_admin
    depends_on:
      router-user-init:
        condition: service_completed_successfully
        restart: true
    entrypoint: ["/bin/sh", "/usr/local/bin/router-allowance-manager.sh"]
    healthcheck:
      test: ["CMD", "/bin/sh", "/usr/local/bin/router-allowance-manager.sh", "--health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  proxy-router:
    image: ghcr.io/morpheusais/morpheus-lumerin-node:v7.15.0@sha256:c52e9f12725d7c85e09eec11e0c06ae2b0970d12d1c770dc4daa4cc66f961ea4
    restart: unless-stopped
    logging: *default-logging
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/healthcheck || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    environment:
      - WALLET_PRIVATE_KEY=${WALLET_PRIVATE_KEY}
      - ETH_NODE_ADDRESS=${ETH_NODE_ADDRESS}
      - ETH_NODE_CHAIN_ID=${ETH_NODE_CHAIN_ID:-8453}
      - ETH_NODE_USE_SUBSCRIPTIONS=false
      - BLOCKSCOUT_API_URL=${BLOCKSCOUT_API_URL:-https://base.blockscout.com/api/v2}
      - DIAMOND_CONTRACT_ADDRESS=${DIAMOND_CONTRACT_ADDRESS:-0x6aBE1d282f72B474E54527D93b979A4f64d3030a}
      - MOR_TOKEN_ADDRESS=${MOR_TOKEN_ADDRESS:-0x7431ada8a591c955a994a21710752ef9b882b8e3}
      - COOKIE_CONTENT=${COOKIE_CONTENT:?set COOKIE_CONTENT to admin:password}
      - WEB_PUBLIC_URL=${WEB_PUBLIC_URL}
      - AUTH_CONFIG_FILE_PATH=/app/data/proxy.conf
      - COOKIE_FILE_PATH=/app/data/.cookie
      - ENVIRONMENT=production
      - PROXY_STORE_CHAT_CONTEXT=false
      - PROXY_FORWARD_CHAT_CONTEXT=false
      - LOG_LEVEL_APP=warn
      - LOG_LEVEL_TCP=warn
      - LOG_LEVEL_ETH_RPC=warn
    volumes:
      - router_data:/app/data
    networks:
      - web
      - router_admin

volumes:
  uplink_data:
  router_data:
  router_auth:
  manager_cred:
  allowance_status:
  allowance_ctl:
  caddy_data:
  caddy_config:

networks:
  # Manager <-> proxy-router only; no external connectivity.
  router_admin:
    internal: true
  web:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

configs:
  caddyfile:
    content: |
      {$PUBLIC_HOST} {
        log {
          output stdout
          format json
        }
        @allowed {
          path / /gui /gui/* /v1/* /admin/* /healthcheck
        }
        handle @allowed {
          reverse_proxy uplink:8080 {
            flush_interval -1
          }
        }
        handle {
          respond 404
        }
      }
