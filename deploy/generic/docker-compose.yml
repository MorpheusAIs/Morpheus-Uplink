# Uplink on any Docker host (VPS, Phala/dstack, home lab).
#
# Same stack as SecretVM, but secrets come from a normal .env file and
# Caddy terminates TLS with Let's Encrypt (no SecretVM cert mount).
#
# Prefer the digest-pinned release asset (no git clone):
#   curl -fsSL -O https://github.com/MorpheusAIs/Morpheus-Uplink/releases/latest/download/docker-compose.generic.deployed.yml
#   curl -fsSL -o .env https://github.com/MorpheusAIs/Morpheus-Uplink/releases/latest/download/env.generic.example
#   # edit .env (PUBLIC_HOST + secrets), then:
#   docker compose -f docker-compose.generic.deployed.yml --env-file .env up -d
#
# Gateway: https://${PUBLIC_HOST}/gui
# Only :80 and :443 need to be public. Router :8082 stays internal.
#
# Privacy env (L1): PROXY_* and LOG_LEVEL_* are set and believed honored on
# pinned v7.11.6-test; live acceptance pending. Do not market as TEE privacy.
#
# Lumerin pin note: tag v7.11.6-test is the Lumerin release channel (includes
# #889 gateway caps early access), NOT Base testnet -- chain comes from env
# (defaults Base mainnet 8453 / Diamond / MOR below).
#
# H2 blast radius / H3 single-replica: see deploy/generic/README.md.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST to your DNS name}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    networks:
      - web
    depends_on:
      - uplink

  uplink:
    image: ghcr.io/morpheusais/uplink:latest
    restart: unless-stopped
    logging: *default-logging
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - API_KEY_SEED=${API_KEY_SEED}
      # Same user:pass as the router (ROUTER_AUTH in .env.example works if you also set COOKIE_CONTENT=...).
      - COOKIE_CONTENT=${COOKIE_CONTENT:?set COOKIE_CONTENT to user:password}
      - ROUTER_URL=http://proxy-router:8082
      - ETH_NODE_ADDRESS=${ETH_NODE_ADDRESS}
      - WALLET_PRIVATE_KEY=${WALLET_PRIVATE_KEY}
      - SESSION_DURATION_SECONDS=${SESSION_DURATION_SECONDS:-600}
      - DATA_DIR=/data
    volumes:
      - uplink_data:/data
    networks:
      - web
    depends_on:
      - proxy-router

  proxy-router:
    image: ghcr.io/morpheusais/morpheus-lumerin-node:v7.11.6-test@sha256:da9890e376174d587d465c4d2679984939b085e06a3b34fc52a0ac9b19bb999f
    restart: unless-stopped
    logging: *default-logging
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/healthcheck || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    environment:
      - WALLET_PRIVATE_KEY=${WALLET_PRIVATE_KEY}
      - ETH_NODE_ADDRESS=${ETH_NODE_ADDRESS}
      - ETH_NODE_CHAIN_ID=${ETH_NODE_CHAIN_ID:-8453}
      - ETH_NODE_USE_SUBSCRIPTIONS=false
      - BLOCKSCOUT_API_URL=${BLOCKSCOUT_API_URL:-https://base.blockscout.com/api/v2}
      - DIAMOND_CONTRACT_ADDRESS=${DIAMOND_CONTRACT_ADDRESS:-0x6aBE1d282f72B474E54527D93b979A4f64d3030a}
      - MOR_TOKEN_ADDRESS=${MOR_TOKEN_ADDRESS:-0x7431ada8a591c955a994a21710752ef9b882b8e3}
      - COOKIE_CONTENT=${COOKIE_CONTENT:?set COOKIE_CONTENT to user:password}
      - WEB_PUBLIC_URL=https://${PUBLIC_HOST}
      # Privacy (L1: set / believed honored; live acceptance pending).
      - PROXY_STORE_CHAT_CONTEXT=false
      - PROXY_FORWARD_CHAT_CONTEXT=false
      - LOG_LEVEL_APP=warn
      - LOG_LEVEL_TCP=warn
      - LOG_LEVEL_ETH_RPC=warn
    volumes:
      - router_data:/app/data
    networks:
      - web
    # H3: single replica for this wallet-bearing proxy-router (multi-replica unsupported).

volumes:
  uplink_data:
  router_data:
  caddy_data:
  caddy_config:

networks:
  web:
    driver: bridge

configs:
  caddyfile:
    content: |
      {$PUBLIC_HOST} {
        reverse_proxy uplink:8080 {
          flush_interval -1
        }
      }
