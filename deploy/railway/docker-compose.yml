# Railway overlay scaffold - same GHCR image pair as SecretVM/generic.
#
# Images are stock digests only. Do NOT docker build the Lumerin node here.
# Secret-class vars (H4) belong in Railway Secrets, never in this file or
# railway.toml: WALLET_PRIVATE_KEY, ADMIN_PASSWORD, API_KEY_SEED,
# COOKIE_CONTENT, ETH_NODE_ADDRESS (RPC).
#
# H3: single replica for wallet-bearing proxy-router (multi-replica unsupported).
# H2 blast radius / operator notes: see deploy/railway/README.md.
#
# Privacy (L1): set / believed honored on pinned v7.11.6-test; live acceptance pending.
#
# Lumerin pin note: tag v7.11.6-test is the Lumerin release channel (includes
# #889 gateway caps early access), NOT Base testnet — chain comes from env
# (defaults Base mainnet 8453 / Diamond / MOR below).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  uplink:
    image: ghcr.io/absgrafx/uplink:latest
    restart: unless-stopped
    logging: *default-logging
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    ports:
      - "8080:8080"
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - API_KEY_SEED=${API_KEY_SEED}
      - COOKIE_CONTENT=${COOKIE_CONTENT}
      - ROUTER_URL=http://proxy-router:8082
      - ETH_NODE_ADDRESS=${ETH_NODE_ADDRESS}
      - WALLET_PRIVATE_KEY=${WALLET_PRIVATE_KEY}
      - SESSION_DURATION_SECONDS=${SESSION_DURATION_SECONDS:-600}
      - WEB_PUBLIC_URL=${WEB_PUBLIC_URL:-https://${RAILWAY_PUBLIC_DOMAIN}}
      - DATA_DIR=/data
    volumes:
      - uplink_data:/data
    depends_on:
      - proxy-router

  proxy-router:
    image: ghcr.io/morpheusais/morpheus-lumerin-node:v7.11.6-test@sha256:da9890e376174d587d465c4d2679984939b085e06a3b34fc52a0ac9b19bb999f
    restart: unless-stopped
    logging: *default-logging
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/healthcheck || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # No public port on router - only uplink reaches :8082 on the private network.
    environment:
      - WALLET_PRIVATE_KEY=${WALLET_PRIVATE_KEY}
      - ETH_NODE_ADDRESS=${ETH_NODE_ADDRESS}
      - ETH_NODE_CHAIN_ID=${ETH_NODE_CHAIN_ID:-8453}
      - ETH_NODE_USE_SUBSCRIPTIONS=false
      - BLOCKSCOUT_API_URL=${BLOCKSCOUT_API_URL:-https://base.blockscout.com/api/v2}
      - DIAMOND_CONTRACT_ADDRESS=${DIAMOND_CONTRACT_ADDRESS:-0x6aBE1d282f72B474E54527D93b979A4f64d3030a}
      - MOR_TOKEN_ADDRESS=${MOR_TOKEN_ADDRESS:-0x7431ada8a591c955a994a21710752ef9b882b8e3}
      - COOKIE_CONTENT=${COOKIE_CONTENT}
      - WEB_PUBLIC_URL=${WEB_PUBLIC_URL:-https://${RAILWAY_PUBLIC_DOMAIN}}
      - PROXY_STORE_CHAT_CONTEXT=false
      - PROXY_FORWARD_CHAT_CONTEXT=false
      - LOG_LEVEL_APP=warn
      - LOG_LEVEL_TCP=warn
      - LOG_LEVEL_ETH_RPC=warn
    volumes:
      - router_data:/app/data
    # H3: deploy with replicas=1 for this wallet-bearing service.

volumes:
  uplink_data:
  router_data:
