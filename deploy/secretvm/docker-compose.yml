# UPLINK on SecretVM - Personal API Gateway for Morpheus
#
# Traefik terminates TLS; scoped router user is minted by router-user-init
# (COOKIE_CONTENT only on init + proxy-router). Uplink reads ROUTER_AUTH from
# a shared volume (mode 0400); Traefik gets zero secrets.
#
# Operator fillables (Encrypted Secrets): ADMIN_PASSWORD, API_KEY_SEED,
# COOKIE_CONTENT, WALLET_PRIVATE_KEY, ETH_NODE_ADDRESS, WEB_PUBLIC_URL,
# UPLINK_MOR_ALLOWANCE_WEI.
#
# Lumerin pin: v7.15.0 digest. Uplink image TODO digest until Alan build go.
# H2/H3: see deploy/secretvm/README.md.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  router-user-init:
    image: curlimages/curl:8.12.1@sha256:94e9e444bcba979c2ea12e27ae39bee4cd10bc7041a472c4727a558e213744e6
    # Root so named-volume /shared is writable and file can be chowned to 10001.
    user: "0:0"
    restart: "no"
    logging: *default-logging
    environment:
      - COOKIE_CONTENT=${COOKIE_CONTENT}
      - UPLINK_MOR_ALLOWANCE_WEI=${UPLINK_MOR_ALLOWANCE_WEI}
    configs:
      - source: router_user_init
        target: /init.sh
        mode: 0555
    volumes:
      - router_auth:/shared
    networks:
      - web
    depends_on:
      - proxy-router
    entrypoint: ["/bin/sh", "/init.sh"]

  uplink:
    # TODO digest: pin after Alan build go (CI release check fails if still :latest or TODO)
    image: ghcr.io/morpheusais/uplink:latest # TODO digest=@sha256:REPLACE_AFTER_ALAN_BUILD
    restart: unless-stopped
    logging: *default-logging
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_2FA_REQUIRED=true
      - MASTER_KEY_ADMIN=false
      - API_KEY_SEED=${API_KEY_SEED}
      - UPLINK_MOR_ALLOWANCE_WEI=${UPLINK_MOR_ALLOWANCE_WEI}
      - WEB_PUBLIC_URL=${WEB_PUBLIC_URL}
    configs:
      - source: uplink_bake_env
        target: /etc/uplink/bake.env
    volumes:
      - uplink_data:/data
      - router_auth:/shared:ro
    networks:
      - web
    depends_on:
      router-user-init:
        condition: service_completed_successfully

  proxy-router:
    image: ghcr.io/morpheusais/morpheus-lumerin-node:v7.15.0@sha256:c52e9f12725d7c85e09eec11e0c06ae2b0970d12d1c770dc4daa4cc66f961ea4
    restart: unless-stopped
    logging: *default-logging
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/healthcheck || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    environment:
      - WALLET_PRIVATE_KEY=${WALLET_PRIVATE_KEY}
      - ETH_NODE_ADDRESS=${ETH_NODE_ADDRESS}
      - COOKIE_CONTENT=${COOKIE_CONTENT}
      - WEB_PUBLIC_URL=${WEB_PUBLIC_URL}
    configs:
      - source: router_network_env
        target: /app/.env
    volumes:
      - router_data:/app/data
    networks:
      - web

  traefik:
    image: traefik:v2.11.28@sha256:247c456388728396fda0cb8e500c0d5d83d0624cc364623479cca4cb0fa5257c
    restart: unless-stopped
    logging: *default-logging
    command:
      - --api.insecure=false
      - --accesslog=true
      - --accesslog.format=json
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls.options=default@file
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
    ports:
      - 443:443
    volumes:
      - /mnt/secure/cert:/certs:ro
    networks:
      - web
    configs:
      - source: tls_config
        target: /etc/traefik/dynamic/tls.yml
      - source: routes_config
        target: /etc/traefik/dynamic/routes.yml

volumes:
  uplink_data:
  router_data:
  router_auth:

networks:
  web:
    driver: bridge

configs:
  uplink_bake_env:
    content: |-
      SESSION_DURATION_SECONDS=600
      SESSION_FAILOVER=true
      ACTIVE_MODELS_URL=https://active.mor.org/gateway_models.json
      GATEWAY_BIDS_URL=https://active.mor.org/gateway_bids.json
      HOUSEKEEPING=true
      ROUTER_URL=http://proxy-router:8082
      ROUTER_AUTH_FILE=/shared/router.auth
      DATA_DIR=/data
  router_network_env:
    content: |-
      ETH_NODE_CHAIN_ID=8453
      ETH_NODE_USE_SUBSCRIPTIONS=false
      BLOCKSCOUT_API_URL=https://base.blockscout.com/api/v2
      DIAMOND_CONTRACT_ADDRESS=0x6aBE1d282f72B474E54527D93b979A4f64d3030a
      MOR_TOKEN_ADDRESS=0x7431ada8a591c955a994a21710752ef9b882b8e3
      AUTH_CONFIG_FILE_PATH=/app/data/proxy.conf
      COOKIE_FILE_PATH=/app/data/.cookie
      ENVIRONMENT=production
      PROXY_STORE_CHAT_CONTEXT=false
      PROXY_FORWARD_CHAT_CONTEXT=false
      LOG_LEVEL_APP=warn
      LOG_LEVEL_TCP=warn
      LOG_LEVEL_ETH_RPC=warn
  router_user_init:
    content: |-
      #!/bin/sh
      # Create scoped router user "uplink" with MOR allowance. Idempotent.
      # Writes uplink:<password> to ROUTER_AUTH_OUT (mode 0400). Never logs the password.
      set -eu

      ROUTER_URL="${ROUTER_URL:-http://proxy-router:8082}"
      AUTH_OUT="${ROUTER_AUTH_OUT:-/shared/router.auth}"
      USER_NAME="${UPLINK_ROUTER_USER:-uplink}"
      ALLOWANCE_WEI="${UPLINK_MOR_ALLOWANCE_WEI:?UPLINK_MOR_ALLOWANCE_WEI required}"
      MOR_TOKEN="${MOR_TOKEN_ADDRESS:-0x7431ada8a591c955a994a21710752ef9b882b8e3}"
      # Lowercase token address (router allowance lookup is case-sensitive to lower).
      MOR_TOKEN=$(printf '%s' "$MOR_TOKEN" | tr 'A-F' 'a-f')

      if [ -z "$ALLOWANCE_WEI" ] || [ "$ALLOWANCE_WEI" = "0" ]; then
        echo "router-user-init: UPLINK_MOR_ALLOWANCE_WEI missing or zero" >&2
        exit 1
      fi

      COOKIE_CONTENT="${COOKIE_CONTENT:?COOKIE_CONTENT required for admin confirm}"
      ADMIN_USER=$(printf '%s' "$COOKIE_CONTENT" | cut -d: -f1)
      ADMIN_PASS=$(printf '%s' "$COOKIE_CONTENT" | cut -d: -f2-)

      echo "router-user-init: waiting for router healthcheck..."
      i=0
      while [ "$i" -lt 90 ]; do
        if curl -fsS "$ROUTER_URL/healthcheck" >/dev/null 2>&1; then
          break
        fi
        i=$((i + 1))
        sleep 2
      done
      if [ "$i" -ge 90 ]; then
        echo "router-user-init: router healthcheck timeout" >&2
        exit 1
      fi

      PASS=$(dd if=/dev/urandom bs=32 count=1 2>/dev/null | od -An -tx1 | tr -d ' \n')
      if [ "${#PASS}" -lt 32 ]; then
        echo "router-user-init: failed to generate password" >&2
        exit 1
      fi

      PERMS='["chat","embeddings","open_session","close_session","get_sessions","get_wallet","get_balance","get_supply","get_budget","get_stakes_on_hold","withdraw_user_stakes"]'

      echo "router-user-init: delete existing user (ignore errors)..."
      curl -fsS -u "${ADMIN_USER}:${ADMIN_PASS}" -X DELETE \
        -H 'Content-Type: application/json' \
        -d "{\"username\":\"${USER_NAME}\"}" \
        "$ROUTER_URL/auth/users" >/dev/null 2>&1 || true

      echo "router-user-init: request agent user..."
      # Build JSON without echoing password to logs - use env for curl data via printf to file
      REQ_FILE=$(mktemp)
      CONF_FILE=$(mktemp)
      trap 'rm -f "$REQ_FILE" "$CONF_FILE"' EXIT
      printf '{"username":"%s","password":"%s","perms":%s,"allowances":{"%s":"%s"}}' \
        "$USER_NAME" "$PASS" "$PERMS" "$MOR_TOKEN" "$ALLOWANCE_WEI" > "$REQ_FILE"

      curl -fsS -X POST -H 'Content-Type: application/json' \
        --data-binary @"$REQ_FILE" \
        "$ROUTER_URL/auth/users/request" >/dev/null

      echo "router-user-init: confirm agent user..."
      printf '{"username":"%s","confirm":true}' "$USER_NAME" > "$CONF_FILE"
      curl -fsS -u "${ADMIN_USER}:${ADMIN_PASS}" -X POST \
        -H 'Content-Type: application/json' \
        --data-binary @"$CONF_FILE" \
        "$ROUTER_URL/auth/users/confirm" >/dev/null

      umask 077
      printf '%s:%s\n' "$USER_NAME" "$PASS" > "$AUTH_OUT"
      chown 10001:10001 "$AUTH_OUT" 2>/dev/null || true
      chmod 0400 "$AUTH_OUT"
      echo "router-user-init: wrote ROUTER_AUTH file (mode 0400, uid 10001); done"
  tls_config:
    content: |-
      tls:
        certificates:
          - certFile: /certs/secret_vm_fullchain.pem
            keyFile: /certs/secret_vm_private.pem
        stores:
          default:
            defaultCertificate:
              certFile: /certs/secret_vm_fullchain.pem
              keyFile: /certs/secret_vm_private.pem
  routes_config:
    content: |-
      http:
        middlewares:
          uplink-ratelimit:
            rateLimit:
              average: 30
              burst: 60
          # Router login is not exposed on Traefik; this limit covers Uplink admin+API.
          # Keep tight to slow password guessing on /admin.
          force404path:
            replacePath:
              path: /__denied__
        routers:
          uplink-allowed:
            rule: "PathPrefix(`/gui`) || PathPrefix(`/v1`) || PathPrefix(`/admin`) || Path(`/healthcheck`) || Path(`/`)"
            entryPoints:
              - websecure
            tls: {}
            middlewares:
              - uplink-ratelimit
            service: uplink
            priority: 10
          uplink-deny:
            rule: PathPrefix(`/`)
            entryPoints:
              - websecure
            tls: {}
            middlewares:
              - force404path
            service: uplink
            priority: 1
        services:
          uplink:
            loadBalancer:
              servers:
                - url: http://uplink:8080
