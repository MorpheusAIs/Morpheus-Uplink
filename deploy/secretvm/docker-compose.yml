# UPLINK on SecretVM - Personal API Gateway for Morpheus
#
# Pattern mirrors the provider TEE compose (Morpheus-Lumerin-Node
# proxy-router/docker-compose.tee.yml): Traefik terminates TLS on :443 with
# SecretVM's auto-generated certs; everything routes to uplink, which wraps
# the consumer-mode proxy-router. No other ports face the internet - a
# consumer node needs no inbound :3333.
#
# Paste this as the VM's Docker Compose, and fill Encrypted Secrets
# (SecretVM auto-prompts from the substitutions below).
#
# Split for a clean secrets form:
#   - Real secrets / user knobs: environment substitutions below (prompted)
#   - Base network config: configs router_network_env (NOT prompted)
services:
  uplink:
    # Template only - for real deployments use the digest-pinned
    # docker-compose.secretvm.deployed.yml attached to each GitHub release.
    # ROUTER_URL and DATA_DIR defaults are baked into the image.
    image: ghcr.io/absgrafx/uplink:latest
    restart: unless-stopped
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - API_KEY_SEED=${API_KEY_SEED}
      # Same cookie as the router; uplink accepts COOKIE_CONTENT as auth.
      - COOKIE_CONTENT=${COOKIE_CONTENT}
      # Optional: shorter sessions lock less MOR (default 3600).
      - SESSION_DURATION_SECONDS=${SESSION_DURATION_SECONDS:-3600}
    env_file:
      - usr/.env
    volumes:
      - uplink_data:/data
    networks:
      - web
    labels:
      - traefik.enable=true
      - traefik.http.routers.uplink.rule=PathPrefix(`/`)
      - traefik.http.routers.uplink.entrypoints=websecure
      - traefik.http.routers.uplink.tls=true
      - traefik.http.services.uplink.loadbalancer.server.port=8080

  proxy-router:
    image: ghcr.io/morpheusais/morpheus-lumerin-node:latest
    restart: unless-stopped
    environment:
      - WALLET_PRIVATE_KEY=${WALLET_PRIVATE_KEY}
      - ETH_NODE_ADDRESS=${ETH_NODE_ADDRESS}
      - COOKIE_CONTENT=${COOKIE_CONTENT}
      # Optional: public URL + /node so swagger "Try it out" links are right.
      - WEB_PUBLIC_URL=${WEB_PUBLIC_URL:-https://localhost}
    # Consumer mode: no MODELS_CONFIG_CONTENT, no provider registration.
    env_file:
      - usr/.env
    configs:
      - source: router_network_env
        target: /app/.env
    volumes:
      - router_data:/app/data
    networks:
      - web
    # Intentionally no ports: only uplink (and traefik) can reach :8082.

  traefik:
    image: traefik:v2.10
    restart: unless-stopped
    command:
      - --api.insecure=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls.options=default@file
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
    ports:
      - 443:443
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /mnt/secure/cert:/certs:ro
    networks:
      - web
    configs:
      - source: tls_config
        target: /etc/traefik/dynamic/tls.yml

volumes:
  uplink_data:
  router_data:

networks:
  web:
    driver: bridge

configs:
  # Non-secret Base mainnet config (Morpheus-Lumerin-Node main.env).
  # Kept out of environment: so SecretVM does not put these in Encrypted Secrets.
  # Loaded by the router's godotenv.Load(".env"); process env wins over this file.
  router_network_env:
    content: |-
      ETH_NODE_CHAIN_ID=8453
      ETH_NODE_USE_SUBSCRIPTIONS=false
      BLOCKSCOUT_API_URL=https://base.blockscout.com/api/v2
      DIAMOND_CONTRACT_ADDRESS=0x6aBE1d282f72B474E54527D93b979A4f64d3030a
      MOR_TOKEN_ADDRESS=0x7431ada8a591c955a994a21710752ef9b882b8e3
  tls_config:
    content: |-
      tls:
        certificates:
          - certFile: /certs/secret_vm_fullchain.pem
            keyFile: /certs/secret_vm_private.pem
        stores:
          default:
            defaultCertificate:
              certFile: /certs/secret_vm_fullchain.pem
              keyFile: /certs/secret_vm_private.pem
