# UPLINK on SecretVM - Personal API Gateway for Morpheus
#
# Pattern mirrors the provider TEE compose (Morpheus-Lumerin-Node
# proxy-router/docker-compose.tee.yml): Traefik terminates TLS on :443 with
# SecretVM's auto-generated certs; everything routes to uplink, which wraps
# the consumer-mode proxy-router. No other ports face the internet - a
# consumer node needs no inbound :3333.
#
# Paste this as the VM's Docker Compose, and fill Encrypted Secrets
# (SecretVM auto-prompts from the substitutions below).
#
# Split for a clean secrets form (SecretVM scrapes ALL environment: keys,
# literals included -- not only dollar-brace substitutions):
#   - Operator fillables (6): the dollar-brace substitutions below
#   - Behavior bake + Base network: configs (NOT prompted) -- session /
#     catalog / housekeeping / PROXY_* / LOG_LEVEL_* / chain / Diamond / MOR
#
# Privacy env (L1): PROXY_* and LOG_LEVEL_* live in configs and are believed
# honored on pinned v7.11.6-test; live acceptance pending. Do not market as TEE
# privacy until verified on the pinned digest.
#
# Lumerin pin note: tag v7.11.6-test is the Lumerin release channel (includes
# #889 gateway caps early access), NOT Base testnet -- chain comes from env
# (defaults Base mainnet 8453 / Diamond / MOR below).
#
# Traefik SSE buffering: do not invent Traefik flags that break TEE TLS.
# Prefer documented middleware only after Josh/ops confirm. Generic overlay
# uses Caddy flush_interval -1; SecretVM Traefik buffering check is pending.
#
# H2 blast radius / H3 single-replica: see deploy/secretvm/README.md.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  uplink:
    # Template only - for real deployments use the digest-pinned
    # docker-compose.secretvm.deployed.yml attached to each GitHub release.
    # ROUTER_URL and DATA_DIR defaults are baked into the image.
    image: ghcr.io/morpheusais/uplink:latest
    restart: unless-stopped
    logging: *default-logging
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # su-exec needs these after cap_drop ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    environment:
      # Encrypted Secrets form scrapes every environment: key -- keep ONLY the six operator fillables.
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - API_KEY_SEED=${API_KEY_SEED}
      # Same cookie as the router; uplink accepts COOKIE_CONTENT as auth.
      - COOKIE_CONTENT=${COOKIE_CONTENT}
      # Same Base RPC + wallet as the router - daylocked MOR reads + post-midnight reclaim.
      - ETH_NODE_ADDRESS=${ETH_NODE_ADDRESS}
      - WALLET_PRIVATE_KEY=${WALLET_PRIVATE_KEY}
      # Public HTTPS origin (GUI / swagger). Fill with https://<vm-host>.
      - WEB_PUBLIC_URL=${WEB_PUBLIC_URL}
    env_file:
      - usr/.env
    configs:
      - source: uplink_bake_env
        target: /etc/uplink/bake.env
    volumes:
      - uplink_data:/data
    networks:
      - web
    labels:
      - traefik.enable=true
      - traefik.http.routers.uplink.rule=PathPrefix(`/`)
      - traefik.http.routers.uplink.entrypoints=websecure
      - traefik.http.routers.uplink.tls=true
      - traefik.http.services.uplink.loadbalancer.server.port=8080

  proxy-router:
    image: ghcr.io/morpheusais/morpheus-lumerin-node:v7.11.6-test@sha256:da9890e376174d587d465c4d2679984939b085e06a3b34fc52a0ac9b19bb999f
    restart: unless-stopped
    logging: *default-logging
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/healthcheck || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    environment:
      # Encrypted Secrets form scrapes every environment: key -- keep ONLY operator fillables.
      - WALLET_PRIVATE_KEY=${WALLET_PRIVATE_KEY}
      - ETH_NODE_ADDRESS=${ETH_NODE_ADDRESS}
      - COOKIE_CONTENT=${COOKIE_CONTENT}
      - WEB_PUBLIC_URL=${WEB_PUBLIC_URL}
    # Consumer mode: no MODELS_CONFIG_CONTENT, no provider registration.
    env_file:
      - usr/.env
    configs:
      - source: router_network_env
        target: /app/.env
    volumes:
      - router_data:/app/data
    networks:
      - web
    # Intentionally no ports: only uplink (and traefik) can reach :8082.
    # H3: single replica for this wallet-bearing proxy-router (multi-replica unsupported).

  traefik:
    image: traefik:v2.10
    restart: unless-stopped
    logging: *default-logging
    command:
      - --api.insecure=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls.options=default@file
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
    ports:
      - 443:443
    volumes:
      # Keep :ro docker.sock and cert mounts - do not harden Traefik in a way
      # that removes these (SecretVM edge requires them).
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /mnt/secure/cert:/certs:ro
    networks:
      - web
    configs:
      - source: tls_config
        target: /etc/traefik/dynamic/tls.yml

volumes:
  uplink_data:
  router_data:

networks:
  web:
    driver: bridge

configs:
  # Uplink non-secret behavior bake (entrypoint sources /etc/uplink/bake.env).
  # Kept out of environment: so SecretVM does not put these in Encrypted Secrets.
  # Change later via code / compose only -- not operator forms.
  uplink_bake_env:
    content: |-
      SESSION_DURATION_SECONDS=600
      SESSION_FAILOVER=true
      ACTIVE_MODELS_URL=https://active.mor.org/gateway_models.json
      GATEWAY_BIDS_URL=https://active.mor.org/gateway_bids.json
      HOUSEKEEPING=true
  # Non-secret runtime + Base mainnet config (Morpheus-Lumerin-Node main.env).
  # Kept out of environment: so SecretVM does not put these in Encrypted Secrets.
  # Loaded by the router's godotenv.Load(".env"); process env wins over this file.
  # Privacy (L1: set / believed honored; live acceptance pending).
  router_network_env:
    content: |-
      ETH_NODE_CHAIN_ID=8453
      ETH_NODE_USE_SUBSCRIPTIONS=false
      BLOCKSCOUT_API_URL=https://base.blockscout.com/api/v2
      DIAMOND_CONTRACT_ADDRESS=0x6aBE1d282f72B474E54527D93b979A4f64d3030a
      MOR_TOKEN_ADDRESS=0x7431ada8a591c955a994a21710752ef9b882b8e3
      PROXY_STORE_CHAT_CONTEXT=false
      PROXY_FORWARD_CHAT_CONTEXT=false
      LOG_LEVEL_APP=warn
      LOG_LEVEL_TCP=warn
      LOG_LEVEL_ETH_RPC=warn
  tls_config:
    content: |-
      tls:
        certificates:
          - certFile: /certs/secret_vm_fullchain.pem
            keyFile: /certs/secret_vm_private.pem
        stores:
          default:
            defaultCertificate:
              certFile: /certs/secret_vm_fullchain.pem
              keyFile: /certs/secret_vm_private.pem
