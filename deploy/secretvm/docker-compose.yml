# UPLINK on SecretVM - Personal API Gateway for Morpheus
#
# Traefik terminates TLS on :443 and routes an allowlist of Uplink paths;
# Traefik gets zero secrets. Uplink talks to proxy-router over the internal
# network with the router's COOKIE_CONTENT. Router ports are never published.
#
# Operator fillables (Encrypted Secrets): ADMIN_PASSWORD, API_KEY_SEED,
# COOKIE_CONTENT, WALLET_PRIVATE_KEY, ETH_NODE_ADDRESS, WEB_PUBLIC_URL.
# WALLET_PRIVATE_KEY and ETH_NODE_ADDRESS go to proxy-router only.
#
# Lumerin pin: v7.17.0 digest. The Uplink image is pinned to its digest in
# the release assets (scripts/deploy-assets.sh).
# H2/H3: see deploy/secretvm/README.md.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  uplink:
    # Release assets pin this to the built digest (scripts/deploy-assets.sh).
    image: ghcr.io/morpheusais/uplink:latest
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    # No init: true here: the entrypoint execs the app as PID 1 so docker stop
    # delivers SIGTERM to it and open sessions close before exit.
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - API_KEY_SEED=${API_KEY_SEED}
      # Same cookie as the router; uplink accepts COOKIE_CONTENT as auth.
      - COOKIE_CONTENT=${COOKIE_CONTENT}
      - WEB_PUBLIC_URL=${WEB_PUBLIC_URL}
    configs:
      - source: uplink_bake_env
        target: /etc/uplink/bake.env
    volumes:
      - uplink_data:/data
    networks:
      - web
    # Start order only. The router image is FROM scratch (no shell or wget),
    # so it has no container healthcheck; Uplink retries the router itself.
    depends_on:
      - proxy-router

  proxy-router:
    image: ghcr.io/morpheusais/morpheus-lumerin-node:v7.17.0@sha256:da1baa55299133ad63e2e590bd8cc1e95772ff81f4b44e2aa34cabe682e9a14d
    restart: unless-stopped
    logging: *default-logging
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 45s
    environment:
      - WALLET_PRIVATE_KEY=${WALLET_PRIVATE_KEY}
      - ETH_NODE_ADDRESS=${ETH_NODE_ADDRESS}
      - COOKIE_CONTENT=${COOKIE_CONTENT}
      - WEB_PUBLIC_URL=${WEB_PUBLIC_URL}
    configs:
      - source: router_network_env
        target: /app/.env
    volumes:
      - router_data:/app/data
    networks:
      - web
    # Intentionally no ports: only uplink (and traefik) can reach :8082.

  traefik:
    image: traefik:v2.11.28@sha256:247c456388728396fda0cb8e500c0d5d83d0624cc364623479cca4cb0fa5257c
    restart: unless-stopped
    logging: *default-logging
    command:
      - --api.insecure=false
      - --accesslog=true
      - --accesslog.format=json
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls.options=default@file
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
    ports:
      - 443:443
    volumes:
      - /mnt/secure/cert:/certs:ro
    networks:
      - web
    configs:
      - source: tls_config
        target: /etc/traefik/dynamic/tls.yml
      - source: routes_config
        target: /etc/traefik/dynamic/routes.yml

volumes:
  uplink_data:
  router_data:

networks:
  web:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

configs:
  uplink_bake_env:
    content: |-
      ACTIVE_MODELS_URL=https://active.mor.org/gateway_models.json
      GATEWAY_BIDS_URL=https://active.mor.org/gateway_bids.json
      ROUTER_URL=http://proxy-router:8082
      DATA_DIR=/data
      TRUSTED_PROXY_CIDR=172.28.0.0/16
      MASTER_KEY_ADMIN=false
  router_network_env:
    content: |-
      ETH_NODE_CHAIN_ID=8453
      ETH_NODE_USE_SUBSCRIPTIONS=false
      BLOCKSCOUT_API_URL=https://base.blockscout.com/api/v2
      DIAMOND_CONTRACT_ADDRESS=0x6aBE1d282f72B474E54527D93b979A4f64d3030a
      MOR_TOKEN_ADDRESS=0x7431ada8a591c955a994a21710752ef9b882b8e3
      AUTH_CONFIG_FILE_PATH=/app/data/proxy.conf
      COOKIE_FILE_PATH=/app/data/.cookie
      ENVIRONMENT=production
      PROXY_STORE_CHAT_CONTEXT=false
      PROXY_FORWARD_CHAT_CONTEXT=false
      LOG_LEVEL_APP=warn
      LOG_LEVEL_TCP=warn
      LOG_LEVEL_ETH_RPC=warn
  tls_config:
    content: |-
      tls:
        certificates:
          - certFile: /certs/secret_vm_fullchain.pem
            keyFile: /certs/secret_vm_private.pem
        stores:
          default:
            defaultCertificate:
              certFile: /certs/secret_vm_fullchain.pem
              keyFile: /certs/secret_vm_private.pem
  routes_config:
    content: |-
      http:
        middlewares:
          uplink-ratelimit:
            rateLimit:
              average: 30
              burst: 60
          # Router login is not exposed on Traefik; this limit covers Uplink admin+API.
          # Keep tight to slow password guessing on /admin.
          force404path:
            replacePath:
              path: /__denied__
        routers:
          uplink-allowed:
            rule: "PathPrefix(`/gui`) || PathPrefix(`/v1`) || PathPrefix(`/admin`) || Path(`/healthcheck`) || Path(`/`)"
            entryPoints:
              - websecure
            tls: {}
            middlewares:
              - uplink-ratelimit
            service: uplink
            priority: 10
          uplink-deny:
            rule: PathPrefix(`/`)
            entryPoints:
              - websecure
            tls: {}
            middlewares:
              - force404path
            service: uplink
            priority: 1
        services:
          uplink:
            loadBalancer:
              servers:
                - url: http://uplink:8080
