# UPLINK local development stack: consumer proxy-router + gateway.
# No TLS here - Traefik/SecretVM certs are the VPS deployment's concern.
#
#   cp .env.example .env   # fill in wallet key + RPC
#   docker compose -f docker-compose.local.yml up --build
#
# Gateway:  http://localhost:8080          (OpenAI-compatible /v1, GUI at /gui)
# Router:   http://localhost:8082          (only bound to localhost for debugging)
#
# Privacy env (L1): set / believed honored on pinned v7.11.6-test; live acceptance
# pending. Do not market as TEE privacy.
#
# Lumerin pin note: tag v7.11.6-test is the Lumerin release channel (includes
# #889 gateway caps early access), NOT Base testnet — chain comes from env
# (defaults Base mainnet 8453).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  proxy-router:
    image: ghcr.io/morpheusais/morpheus-lumerin-node:v7.11.6-test@sha256:da9890e376174d587d465c4d2679984939b085e06a3b34fc52a0ac9b19bb999f
    restart: unless-stopped
    logging: *default-logging
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/healthcheck || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    environment:
      - WALLET_PRIVATE_KEY=${WALLET_PRIVATE_KEY}
      - ETH_NODE_ADDRESS=${ETH_NODE_ADDRESS}
      - ETH_NODE_CHAIN_ID=${ETH_NODE_CHAIN_ID:-8453}
      - ETH_NODE_USE_SUBSCRIPTIONS=${ETH_NODE_USE_SUBSCRIPTIONS:-false}
      # Base mainnet network config (required by the generic router image;
      # values from Morpheus-Lumerin-Node .github/workflows/main.env).
      - BLOCKSCOUT_API_URL=${BLOCKSCOUT_API_URL:-https://base.blockscout.com/api/v2}
      - DIAMOND_CONTRACT_ADDRESS=${DIAMOND_CONTRACT_ADDRESS:-0x6aBE1d282f72B474E54527D93b979A4f64d3030a}
      - MOR_TOKEN_ADDRESS=${MOR_TOKEN_ADDRESS:-0x7431ada8a591c955a994a21710752ef9b882b8e3}
      - COOKIE_CONTENT=${ROUTER_AUTH}
      - WEB_PUBLIC_URL=http://localhost:8082
      # Privacy (L1: set / believed honored; live acceptance pending).
      - PROXY_STORE_CHAT_CONTEXT=false
      - PROXY_FORWARD_CHAT_CONTEXT=false
      - LOG_LEVEL_APP=warn
      - LOG_LEVEL_TCP=warn
      - LOG_LEVEL_ETH_RPC=warn
      # Consumer mode: no MODELS_CONFIG_CONTENT, nothing served on :3333.
    ports:
      - "127.0.0.1:8082:8082"
    volumes:
      - router_data:/app/data

  uplink:
    build: .
    restart: unless-stopped
    logging: *default-logging
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      - proxy-router
    environment:
      - ROUTER_URL=http://proxy-router:8082
      - ROUTER_AUTH=${ROUTER_AUTH}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - API_KEY_SEED=${API_KEY_SEED}
      - ACTIVE_MODELS_URL=${ACTIVE_MODELS_URL:-https://active.mor.org/gateway_models.json}
      - GATEWAY_BIDS_URL=${GATEWAY_BIDS_URL:-https://active.mor.org/gateway_bids.json}
      - SESSION_DURATION_SECONDS=${SESSION_DURATION_SECONDS:-600}
      - SESSION_FAILOVER=${SESSION_FAILOVER:-true}
      - ETH_NODE_ADDRESS=${ETH_NODE_ADDRESS}
      - WALLET_PRIVATE_KEY=${WALLET_PRIVATE_KEY}
      - ETH_NODE_CHAIN_ID=${ETH_NODE_CHAIN_ID:-8453}
      - DATA_DIR=/data
    ports:
      - "8080:8080"
    volumes:
      - uplink_data:/data

volumes:
  router_data:
  uplink_data:
